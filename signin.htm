<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Glam & Glow</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <section class="signin-section">
    <div class="signin-background">

      <div class="signin-card">

        <!-- LEFT VISUAL SIDE -->
        <div class="signin-visual">
          <img src="images/Logo.png" alt="Glam and Glow logo" />
          <h2>Welcome Back</h2>
          <p>Your skin journey continues here.</p>

          <ul class="visual-points">
            <li>Book and manage your appointments</li>
            <li>See your treatment history</li>
            <li>Get personalized skincare advice</li>
          </ul>
        </div>

        <!-- RIGHT FORM SIDE -->
        <div class="signin-form-side">
          <h1>Sign In</h1>
          <p>Enter your details to access your account.</p>

          <form id="signin-form" novalidate>

            <div class="input-box">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="janedoe123@example.com" required />
            </div>

            <div class="input-box">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Your password" required minlength="8" />
              <button type="button" class="toggle-pass" data-target="password">Show</button>
            </div>

            <div class="form-options">
              <label>
                <input type="checkbox" id="remember" name="remember" />
                Remember me
              </label>
              <a href="forgot.htm">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>

            <p class="form-note" id="form-note"></p>
          </form>

          <div class="account-switch">
            <p>Don't have an account?</p>
            <a href="signup.htm" id="signup-link">Create one</a>
          </div>

          <a href="index.html" class="back-home">&#8592; Back to website</a>
        </div>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/tracker.js"></script>

  <script>
    /* where to go after signing in (e.g. back to the booking) */
    var next = safeNext(new URLSearchParams(location.search).get("next"), "account.htm");
    document.getElementById("signup-link").href = "signup.htm?next=" + encodeURIComponent(next);

    /* already signed in? */
    getSession().then(function (session) {
      if (session) location.replace(next);
    });

    /* show / hide password */
    document.querySelectorAll(".toggle-pass").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.dataset.target);
        var hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "Hide" : "Show";
      });
    });

    /* check the form, then sign in with Supabase */
    var form = document.getElementById("signin-form");
    var note = document.getElementById("form-note");
    var submitBtn = form.querySelector(".submit-btn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;

      if (!email.includes("@") || !email.includes(".")) {
        note.textContent = "Please enter a valid email address.";
        return;
      }
      if (password.length < 8) {
        note.textContent = "Password must be at least 8 characters.";
        return;
      }

      note.textContent = "Checking your details...";
      submitBtn.disabled = true;

      /* "Remember me" decides where the sign-in is kept (see js/config.js) */
      try { localStorage.setItem("gg_remember", document.getElementById("remember").checked ? "1" : "0"); } catch (err) {}
      sb = makeClient();

      var result = await sb.auth.signInWithPassword({ email: email, password: password });

      if (result.error) {
        note.textContent = result.error.message === "Invalid login credentials"
          ? "Wrong email or password."
          : errorMessage(result.error);
        submitBtn.disabled = false;
        return;
      }

      note.textContent = "Welcome back!";
      location.href = next;
    });
  </script>

</body>
</html>
